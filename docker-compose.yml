services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: biblioteca
      MYSQL_USER: biblioteca
      MYSQL_PASSWORD: biblioteca
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ubiblioteca", "-pbiblioteca"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  app:
    build: .
    ports:
      - "80:8080"
    environment:
      DB_URL: jdbc:mysql://db:3306/biblioteca?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      DB_USER: biblioteca
      DB_PASSWORD: biblioteca
    depends_on:
      db:
        condition: service_healthy
